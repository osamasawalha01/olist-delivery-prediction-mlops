
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_mlflow
    working_dir: /app
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/mlflow-data/mlflow.db
      - --artifacts-destination
      - /app/mlflow-data/mlartifacts
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app/mlflow-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  model-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "olist_mlops.register_model"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist_api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      db:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mlflow_data:
